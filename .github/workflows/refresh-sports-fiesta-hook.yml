name: Refresh Hardened Sports Fiesta Hook
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-sports-fiesta-hook.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'sports-fiesta-medal-hook-v4.js' not in s: raise SystemExit('hook not found')
          s=re.sub(r'(sports-fiesta-medal-hook-v4\.js)\?v=[^"\']+',r'\1?v=20260810e',s)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load hardened Sports Fiesta medal hook"
          git push
